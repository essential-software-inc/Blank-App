workflows:
  android-pro-workflow:
    name: Note Builder Pro — Android
    max_build_duration: 60
    instance_type: mac_mini_m2 # linux_x2 is gated behind a paid plan on
      # the free tier; Mac mini M2 works fine for an Android/Gradle build
      # and draws from the same free monthly minutes as the iOS workflow
    environment:
      node: lts
      java: 21 # the Capacitor-generated android/ project's Gradle config
        # requires JDK 21 to compile; the machine's default JDK is older
      android_signing:
        - notebuilderpro_keystore
      vars:
        PACKAGE_NAME: "com.essentialsoftware.notebuilderpro" # must match capacitor.config.pro.ts appId
        APP_VERSION: "3.2.9" # user-facing version name; bump manually per release.
          # PROJECT_BUILD_NUMBER is a built-in Codemagic var (no setup needed)
          # that auto-increments per build and is used below for versionCode.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Select Pro app source files
        script: |
          # Capacitor only ever reads one file, capacitor.config.ts, at the
          # repo root — since this repo builds two different apps (Free and
          # Pro) from two different HTML files, each workflow copies its own
          # dedicated config + HTML source into place before anything else
          # runs. Replaces the old manual "rename before pushing" step —
          # nothing to do by hand anymore, each workflow selects its own.
          cp capacitor.config.pro.ts capacitor.config.ts
          mkdir -p www
          cp note-builder-pro.html www/index.html
      - name: Install npm dependencies
        script: |
          npm install
      - name: Verify appId matches PACKAGE_NAME
        script: |
          # capacitor.config.ts's appId is what actually becomes the native
          # applicationId on `cap add android` — PACKAGE_NAME above is just
          # a reference value with nothing enforcing it, so a silent edit or
          # revert to capacitor.config.pro.ts would otherwise ship under the
          # wrong package with no warning (this is exactly what happened
          # once already). Fail loudly instead.
          CONFIG_APP_ID=$(grep -oE "appId:[[:space:]]*'[^']+'" capacitor.config.ts | sed -E "s/appId:[[:space:]]*'([^']+)'/\1/")
          if [ "$CONFIG_APP_ID" != "$PACKAGE_NAME" ]; then
            echo "ERROR: capacitor.config.ts appId ('$CONFIG_APP_ID') does not match PACKAGE_NAME ('$PACKAGE_NAME')."
            echo "Fix capacitor.config.pro.ts or the PACKAGE_NAME var above before building."
            exit 1
          fi
          echo "appId matches PACKAGE_NAME: $CONFIG_APP_ID"
      - name: Add Android platform (skips if android/ is already committed)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Disable native WebView scrollbar
        script: |
          # The scrollbar flash on splash load is Android's own transient
          # overlay scroll indicator, drawn by the WebView's native View
          # chrome — it shows on any scrollable-capable WebView the first
          # time it lays out content, regardless of page CSS. Hiding it
          # with ::-webkit-scrollbar or overflow:hidden on html/body does
          # nothing, because it isn't a CSS-rendered scrollbar at all.
          #
          # This has to be disabled at the WebView's own construction —
          # and MainActivity.java is the WRONG file for that: Capacitor
          # doesn't use a plain android.webkit.WebView, it uses its own
          # CapacitorWebView subclass, and MainActivity never touches the
          # WebView until after that subclass's constructor has already
          # run, so setting it from MainActivity's onCreate() is too late
          # to have ever worked. CapacitorWebView.java itself isn't part
          # of the android/ project at all — Gradle pulls it in as a
          # local project straight out of node_modules
          # (android/capacitor.settings.gradle points
          # ':capacitor-android' at ../node_modules/@capacitor/android/capacitor),
          # so that's the copy that actually needs patching, and it has to
          # happen after npm install regenerates node_modules each build.
          WEBVIEW_SRC="node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/CapacitorWebView.java"
          python3 - "$WEBVIEW_SRC" <<'PY'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          old = "    public CapacitorWebView(Context context, AttributeSet attrs) {\n        super(context, attrs);\n    }"
          new = "    public CapacitorWebView(Context context, AttributeSet attrs) {\n        super(context, attrs);\n        setVerticalScrollBarEnabled(false);\n        setHorizontalScrollBarEnabled(false);\n    }"
          if old not in content:
              raise SystemExit(
                  "ERROR: CapacitorWebView.java didn't match the expected "
                  "constructor shape - the installed @capacitor/android "
                  "version may have changed it. Update this patch step to match."
              )
          content = content.replace(old, new, 1)
          with open(path, "w") as f:
              f.write(content)
          print("Disabled native WebView scrollbar in", path)
          PY
      - name: Generate app icon from assets/logo.png
        script: |
          npx capacitor-assets generate --android
      - name: Sync Capacitor (copies www/ + plugins into android/)
        script: |
          npx cap sync android
      - name: Set Android app version
        script: |
          sed -i.bak -E "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          sed -i.bak -E "s/versionCode [0-9]+/versionCode $PROJECT_BUILD_NUMBER/" android/app/build.gradle
      - name: Bump minSdkVersion to 26 (required by @capacitor/inappbrowser)
        script: |
          sed -i.bak -E "s/minSdkVersion = [0-9]+/minSdkVersion = 26/" android/variables.gradle
      - name: Add release signing config
        script: |
          # android/ isn't committed to the repo (see "Add Android platform"
          # above) — it's regenerated fresh every build by `cap add android`,
          # so the signingConfigs block has to be injected here each time
          # rather than committed as a one-off edit to build.gradle.
          # android_signing (set above) makes Codemagic inject the keystore
          # file path and its three credentials as env vars on the build
          # machine: CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS,
          # CM_KEY_PASSWORD — this just wires those into Gradle.
          python3 - <<'PY'
          import re

          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          # 1. Point the existing (unsigned) release build type at a signing
          #    config we add next. Must run before step 2 below — the fresh
          #    Capacitor template has exactly one "release {" block (under
          #    buildTypes) at this point, so this regex can only match that
          #    one. Doing step 2 first would add a second "release {" (inside
          #    signingConfigs) ahead of it in the file and this would match
          #    the wrong one.
          content = re.sub(
              r"(release\s*\{)",
              r"\1\n            signingConfig signingConfigs.release",
              content,
              count=1,
          )

          # 2. Insert the signingConfigs block right before buildTypes {,
          #    reading the keystore path/credentials Codemagic injected.
          signing_configs = '''    signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }

          '''
          content = content.replace("    buildTypes {", signing_configs + "    buildTypes {", 1)

          with open(path, "w") as f:
              f.write(content)

          print("Injected release signingConfig into build.gradle")
          PY
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build signed Android App Bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

