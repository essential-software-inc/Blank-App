workflows:
  android-workflow:
    name: Note Builder — Android
    max_build_duration: 60
    instance_type: mac_mini_m2 # linux_x2 is gated behind a paid plan on
      # the free tier; Mac mini M2 works fine for an Android/Gradle build
      # and draws from the same free monthly minutes as the iOS workflow
    environment:
      node: lts
      java: 21 # the Capacitor-generated android/ project's Gradle config
        # requires JDK 21 to compile; the machine's default JDK is older
      android_signing:
        - notebuilderpro_keystore
      vars:
        PACKAGE_NAME: "com.essentialsoftware.notebuilderpro" # must match capacitor.config.ts appId
        APP_VERSION: "3.2.9" # user-facing version name; bump manually per release.
          # PROJECT_BUILD_NUMBER is a built-in Codemagic var (no setup needed)
          # that auto-increments per build and is used below for versionCode.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Verify appId matches PACKAGE_NAME
        script: |
          # capacitor_config.ts's appId is what actually becomes the native
          # applicationId on `cap add android` — PACKAGE_NAME above is just
          # a reference value with nothing enforcing it, so a silent edit or
          # revert to capacitor_config.ts would otherwise ship under the
          # wrong package with no warning (this is exactly what happened
          # once already). Fail loudly instead.
          CONFIG_APP_ID=$(grep -oE "appId:\s*'[^']+'" capacitor_config.ts | sed -E "s/appId:\s*'([^']+)'/\1/")
          if [ "$CONFIG_APP_ID" != "$PACKAGE_NAME" ]; then
            echo "ERROR: capacitor_config.ts appId ('$CONFIG_APP_ID') does not match PACKAGE_NAME ('$PACKAGE_NAME')."
            echo "Fix capacitor_config.ts or the PACKAGE_NAME var above before building."
            exit 1
          fi
          echo "appId matches PACKAGE_NAME: $CONFIG_APP_ID"
      - name: Add Android platform (skips if android/ is already committed)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Generate app icon from assets/logo.png
        script: |
          npx capacitor-assets generate --android
      - name: Sync Capacitor (copies www/ + plugins into android/)
        script: |
          npx cap sync android
      - name: Set Android app version
        script: |
          sed -i.bak -E "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          sed -i.bak -E "s/versionCode [0-9]+/versionCode $PROJECT_BUILD_NUMBER/" android/app/build.gradle
      - name: Bump minSdkVersion to 26 (required by @capacitor/inappbrowser)
        script: |
          sed -i.bak -E "s/minSdkVersion = [0-9]+/minSdkVersion = 26/" android/variables.gradle
      - name: Add release signing config
        script: |
          # android/ isn't committed to the repo (see "Add Android platform"
          # above) — it's regenerated fresh every build by `cap add android`,
          # so the signingConfigs block has to be injected here each time
          # rather than committed as a one-off edit to build.gradle.
          # android_signing (set above) makes Codemagic inject the keystore
          # file path and its three credentials as env vars on the build
          # machine: CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS,
          # CM_KEY_PASSWORD — this just wires those into Gradle.
          python3 - <<'PY'
          import re

          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          # 1. Point the existing (unsigned) release build type at a signing
          #    config we add next. Must run before step 2 below — the fresh
          #    Capacitor template has exactly one "release {" block (under
          #    buildTypes) at this point, so this regex can only match that
          #    one. Doing step 2 first would add a second "release {" (inside
          #    signingConfigs) ahead of it in the file and this would match
          #    the wrong one.
          content = re.sub(
              r"(release\s*\{)",
              r"\1\n            signingConfig signingConfigs.release",
              content,
              count=1,
          )

          # 2. Insert the signingConfigs block right before buildTypes {,
          #    reading the keystore path/credentials Codemagic injected.
          signing_configs = '''    signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }

          '''
          content = content.replace("    buildTypes {", signing_configs + "    buildTypes {", 1)

          with open(path, "w") as f:
              f.write(content)

          print("Injected release signingConfig into build.gradle")
          PY
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build signed Android App Bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

  ios-workflow:
    name: Note Builder — iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: lts
      xcode: latest
      cocoapods: default
      # Uncomment once you have App Store Connect integration set up in
      # Codemagic (Teams → Integrations → Apple Developer Portal), then
      # reference it here for automatic signing:
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: com.essentialsoftware.notebuilderpro
      vars:
        XCODE_WORKSPACE: "App.xcworkspace" # default Capacitor iOS project naming
        XCODE_SCHEME: "App"
        APP_VERSION: "3.2.9" # user-facing version name; bump manually per release.
          # PROJECT_BUILD_NUMBER is a built-in Codemagic var (no setup needed)
          # that auto-increments per build and is used below for the build number.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add iOS platform (skips if ios/ is already committed)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Generate app icon from assets/logo.png
        script: |
          npx capacitor-assets generate --ios
      - name: Sync Capacitor (copies www/ + plugins into ios/)
        script: |
          npx cap sync ios
      - name: Set iOS app version
        script: |
          cd ios/App
          sed -i.bak -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $APP_VERSION;/g" App.xcodeproj/project.pbxproj
          sed -i.bak -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      # Only needed once ios_signing (above) is configured:
      # - name: Set up provisioning profiles
      #   script: xcode-project use-profiles
      - name: Build unsigned .xcarchive (swap for signed export once
          ios_signing is configured)
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
